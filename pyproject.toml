[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netwatch"
version = "1.0.0"
description = "Cross-platform live network connection monitor with security grading and malware flagging"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Naman Kumar Sonker" }]
keywords = ["security", "network", "monitoring", "firewall", "connections"]
classifiers = [
  "Environment :: X11 Applications",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
netwatch = "netwatch.cli:main"
netwatch-gui = "netwatch.gui.app:main"

[tool.setuptools.packages.find]
include = ["netwatch*"]

[tool.setuptools.package-data]
netwatch = ["data/*.txt", "data/*.json"]
